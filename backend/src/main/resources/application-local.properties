# Perfil "local": servidor sem Docker (iniciar-servidor.ps1).
# O banco é um arquivo na pasta de dados, sem precisar instalar o PostgreSQL.
spring.datasource.url=jdbc:h2:file:${HUBIFY_DATA_DIR:./servidor-dados}/banco/hubify;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=hubify
spring.datasource.password=hubify
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Só o servidor Node (na mesma máquina) fala com o backend; a rede não o acessa direto
server.address=127.0.0.1
