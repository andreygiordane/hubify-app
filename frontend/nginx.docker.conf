# Usado pelo docker compose: frontend, API e sinalização num único endereço, só na rede interna.
#   https://IP-DO-SERVIDOR      -> uso normal (microfone/câmera, instalação e push exigem HTTPS)
#   http://IP-DO-SERVIDOR       -> só redireciona para o HTTPS e entrega o certificado da autoridade local
#   http://localhost:5173       -> acesso na própria máquina do servidor
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Porta 80 da rede: nada trafega em HTTP. Só o certificado da autoridade local (que precisa ser
# baixado antes de o aparelho confiar no HTTPS) e o redirecionamento para o endereço seguro.
server {
    listen 8081;
    server_name _;

    location = /hubify-ca.crt {
        alias /etc/nginx/certs/hubify-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="hubify-ca.crt"' always;
        add_header Cache-Control "no-store" always;
    }

    # "location / { return 308 https://...; }" gerado na subida com a porta HTTPS configurada
    include /etc/nginx/hubify-redirect/*.conf;
}

server {
    listen 8080;
    listen 8443 ssl;
    server_name _;

    # Certificado autoassinado gerado na primeira subida (docker/10-selfsigned-cert.sh)
    ssl_certificate     /etc/nginx/certs/hubify.crt;
    ssl_certificate_key /etc/nginx/certs/hubify.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Mesmo limite do backend (imagens Base64 no perfil e anexos)
    client_max_body_size 10m;

    # O navegador só pode falar com este servidor: nenhuma fonte, script, imagem ou conexão externa
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: data: blob:; worker-src 'self' blob:; frame-src 'self' data: blob:; object-src 'self' data: blob:; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # HSTS: só existe se HUBIFY_HSTS=1 no .env (arquivo gerado na subida; ver README)
    include /etc/nginx/hubify-hsts/*.conf;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Certificado da autoridade local: cada aparelho instala uma vez e o HTTPS deixa de mostrar aviso
    location = /hubify-ca.crt {
        alias /etc/nginx/certs/hubify-ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="hubify-ca.crt"' always;
        add_header Cache-Control "no-store" always;
    }

    # App instalável (PWA): o service worker e o manifesto nunca ficam presos em cache
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'" always;
    }
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ice-servers {
        proxy_pass http://video-server:8080;
    }

    # Notificações push: chave pública e registro das assinaturas dos aparelhos
    location /push/ {
        proxy_pass http://video-server:8080;
        proxy_set_header Host $host;
        client_max_body_size 32k;
    }

    location /socket.io/ {
        proxy_pass http://video-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
